spring:
  application:
    name: kalplat-api
  datasource:
    url: jdbc:h2:mem:kalplat;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

---
# Профиль промышленной эксплуатации: СУБД MySQL, выбранная в лабораторной работе № 5
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/kalplat?useUnicode=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:kalplat}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
